<title>Přání</title>
<style>
  :root{
    color-scheme: light;
    --pozadi:#F5F5F7; --karta:#FFFFFF; --inkoust:#1D1D1F; --sedivy:#6E6E73;
    --linka:#E8E8ED; --vstup:#F2F2F6;
    --akcent:#B03A48; --akcent-pozadi:#F9EDEE;
    --ok:#2E7D4F; --ok-pozadi:#EAF4EE;
    --pozor:#8F6412; --pozor-pozadi:#FBF3DF;
    --chyba:#B3372F; --chyba-pozadi:#FBEDEC;
  }
  /* Zamerne jedno tema: svetly design podle zadani, ve tme se nic neprevraci */
  :root[data-theme="dark"], :root[data-theme="light"]{ color-scheme: light; }
  *{ box-sizing:border-box; margin:0; }
  html,body{ background:var(--pozadi); }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    color:var(--inkoust); font-size:16px; line-height:1.45;
    -webkit-font-smoothing:antialiased; padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }
  .obal{ max-width:640px; margin:0 auto; padding:0 16px; }

  header.top{
    position:sticky; top:0; z-index:20; background:rgba(245,245,247,.88);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--linka); padding-top:env(safe-area-inset-top);
  }
  .top-rada{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0 8px; }
  h1{ font-size:28px; font-weight:800; letter-spacing:-.02em; }
  .stav-radek{ font-size:13px; color:var(--sedivy); min-height:18px; padding-bottom:8px; display:flex; align-items:center; gap:6px; }
  .stav-tecka{ width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; }
  .stav-tecka.pozor{ background:var(--pozor); } .stav-tecka.chyba{ background:var(--chyba); }
  button.ikona{
    border:0; background:var(--karta); color:var(--akcent); width:36px; height:36px;
    border-radius:50%; font-size:17px; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.06);
    display:flex; align-items:center; justify-content:center;
  }
  button.ikona:active{ transform:scale(.94); }

  nav.taby{ display:flex; gap:4px; background:#E9E9EE; border-radius:12px; padding:3px; margin:12px 0 4px; }
  nav.taby button{
    flex:1; border:0; background:transparent; font:inherit; font-size:14px; font-weight:600;
    color:var(--sedivy); padding:8px 2px; border-radius:9px; cursor:pointer; position:relative;
  }
  nav.taby button.aktivni{ background:var(--karta); color:var(--inkoust); box-shadow:0 1px 3px rgba(0,0,0,.10); }
  .badge{
    position:absolute; top:2px; right:6px; background:var(--akcent); color:#fff;
    font-size:10px; font-weight:700; border-radius:9px; min-width:17px; height:17px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }

  main{ padding-top:14px; }
  .den-hlava{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
    color:var(--sedivy); margin:22px 2px 8px;
  }
  .den-hlava:first-child{ margin-top:4px; }
  .den-hlava .dnes{ color:var(--akcent); }

  .karta{
    background:var(--karta); border-radius:14px; padding:14px; margin-bottom:10px;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
  }
  .karta.vynechana{ opacity:.55; }
  .k-hlava{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .k-jmeno{ font-size:17px; font-weight:700; letter-spacing:-.01em; }
  .k-kdo{ font-size:13px; color:var(--sedivy); margin-top:1px; }
  .chipy{ display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; flex:none; }
  .chip{
    font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap;
    background:var(--vstup); color:var(--sedivy);
  }
  .chip.narozeniny{ background:var(--akcent-pozadi); color:var(--akcent); }
  .chip.svatek{ background:#EDF2FB; color:#3A5FA8; }
  .chip.zprava{ background:#F0EBF8; color:#6A4CA0; }
  .chip.pozor{ background:var(--pozor-pozadi); color:var(--pozor); }
  .chip.ok{ background:var(--ok-pozadi); color:var(--ok); }
  .chip.chyba{ background:var(--chyba-pozadi); color:var(--chyba); }

  textarea, input[type=text], input[type=tel], input[type=date], input[type=time], input[type=search]{
    width:100%; border:0; background:var(--vstup); border-radius:10px; padding:10px 12px;
    font:inherit; font-size:15px; color:var(--inkoust); outline:none;
  }
  textarea:focus, input:focus{ box-shadow:0 0 0 2px var(--akcent) inset; }
  textarea{ resize:none; min-height:44px; overflow:hidden; }
  textarea::placeholder, input::placeholder{ color:#A6A6AD; }
  .k-telo{ margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .radek{ display:flex; gap:8px; align-items:center; }
  .radek label{ font-size:13px; color:var(--sedivy); flex:none; width:82px; }
  input[type=time], input[type=date]{ width:auto; font-variant-numeric:tabular-nums; }
  .k-akce{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .k-akce a, .k-akce button{
    border:0; font:inherit; font-size:13px; font-weight:600; padding:7px 12px; border-radius:9px;
    cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:5px;
  }
  .tl-jemne{ background:var(--vstup); color:var(--inkoust); }
  .tl-akcent{ background:var(--akcent); color:#fff; }
  .tl-ok{ background:var(--ok-pozadi); color:var(--ok); }

  .prazdno{ text-align:center; color:var(--sedivy); padding:44px 20px; font-size:15px; }
  .prazdno .velke{ font-size:40px; margin-bottom:10px; }

  .hledani{ position:relative; margin-bottom:12px; }
  .filtr-chipy{ display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; -webkit-overflow-scrolling:touch; }
  .filtr-chipy button{
    border:0; font:inherit; font-size:13px; font-weight:600; padding:6px 12px; border-radius:20px;
    background:var(--karta); color:var(--sedivy); cursor:pointer; white-space:nowrap; box-shadow:0 1px 2px rgba(0,0,0,.05);
  }
  .filtr-chipy button.aktivni{ background:var(--inkoust); color:#fff; }

  .osoba-rada{
    background:var(--karta); padding:12px 14px; display:flex; align-items:center; gap:10px; cursor:pointer;
  }
  .osoba-seznam{ border-radius:14px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .osoba-seznam .osoba-rada + .osoba-rada{ border-top:1px solid var(--linka); }
  .osoba-info{ flex:1; min-width:0; }
  .osoba-jmeno{ font-size:15px; font-weight:600; }
  .osoba-meta{ font-size:12px; color:var(--sedivy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .osoba-datumy{ font-size:12px; color:var(--sedivy); text-align:right; flex:none; font-variant-numeric:tabular-nums; }
  .osoba-detail{ background:var(--karta); border-top:1px solid var(--linka); padding:12px 14px 14px; display:flex; flex-direction:column; gap:8px; }
  .prepinac{ display:flex; align-items:center; justify-content:space-between; font-size:14px; }
  .prepinac input{ width:20px; height:20px; accent-color:var(--akcent); }

  .banner{
    border-radius:14px; padding:13px 14px; margin-bottom:12px; font-size:14px;
    background:var(--pozor-pozadi); color:var(--pozor);
  }
  .banner.chyba{ background:var(--chyba-pozadi); color:var(--chyba); }
  .banner b{ display:block; margin-bottom:3px; }
  .banner .k-akce{ margin-top:9px; }

  .ulozit-listu{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:rgba(255,255,255,.92); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-top:1px solid var(--linka); padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    transform:translateY(110%); transition:transform .22s ease;
  }
  .ulozit-listu.videt{ transform:translateY(0); }
  .ulozit-vnitrek{ max-width:640px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .ulozit-vnitrek span{ flex:1; font-size:14px; color:var(--sedivy); }
  .ulozit-vnitrek button{
    border:0; font:inherit; font-size:15px; font-weight:700; background:var(--akcent); color:#fff;
    padding:11px 22px; border-radius:12px; cursor:pointer;
  }
  .ulozit-vnitrek button:disabled{ opacity:.6; }

  .toast{
    position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(8px);
    background:var(--inkoust); color:#fff; font-size:14px; font-weight:600; padding:10px 18px;
    border-radius:22px; opacity:0; transition:.25s; z-index:40; pointer-events:none; white-space:nowrap;
  }
  .toast.videt{ opacity:1; transform:translateX(-50%) translateY(0); }

  .nova-form{ display:flex; flex-direction:column; gap:10px; }
  .vybrany{ display:flex; align-items:center; gap:10px; background:var(--akcent-pozadi); border-radius:12px; padding:10px 12px; }
  .vybrany b{ flex:1; }
  .vybrany button{ border:0; background:transparent; color:var(--akcent); font-size:18px; cursor:pointer; }
  .datum-chipy{ display:flex; gap:6px; flex-wrap:wrap; }
  .datum-chipy button{
    border:0; font:inherit; font-size:13px; font-weight:600; padding:7px 12px; border-radius:9px;
    background:var(--vstup); color:var(--inkoust); cursor:pointer;
  }
  .datum-chipy button.aktivni{ background:var(--inkoust); color:#fff; }

  .paticka{ text-align:center; font-size:12px; color:#A6A6AD; padding:30px 0 10px; }
  @media(min-width:700px){ body{ font-size:16px; } .obal{ padding:0 24px; } }
  @media(prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>

</div></div>

  var p=iso.split("-").map(Number); var d=new Date(p[0],p[1]-1,p[2]);

}

function mcpChybi(){
  $("sekce-fronta").innerHTML='<div class="banner"><b>Stránka nemá spojení</b>Otevři ji v aplikaci Claude nebo na claude.ai, jinak se k datům nedostane.</div>';
}
function popisChyby(e){
  var kod=e&&e.code;
  if(kod==="needs_reauth") return {t:"Google Drive potřebuje znovu připojit. Otevři claude.ai, Nastavení, Konektory a obnov přihlášení.", d:"chyba"};
  if(kod==="server_not_connected") return {t:"Google Drive není připojený. Přidej ho na claude.ai v Nastavení, Konektory.", d:"chyba"};
  if(kod==="selection_required") return {t:"Máš připojených víc účtů Google Drive. Vyber jeden ve výzvě, která se ukázala, a načti znovu.", d:"pozor"};
  if(kod==="server_unavailable") return {t:"Drive zrovna neodpovídá. Zkusím to znovu.", d:"pozor", retry:true};
  if(kod==="not_granted"||kod==="capability_disabled"||kod==="capability_removed") return {t:"Tahle verze aplikace stránce nedovolí sáhnout na Drive. Otevři ji znovu na claude.ai.", d:"chyba"};
  if(kod==="tool_error") return {t:"Drive vrátil chybu: "+(e.message||"neznámá"), d:"chyba"};
  return {t:"Nepovedlo se: "+((e&&e.message)||"neznámá chyba"), d:"chyba"};
}
function zavolej(nastroj, vstup, moznosti){
  return window.claude.mcp.callTool(SERVER, nastroj, vstup, moznosti);
}
function payload(res){
  var p=res&&res.payload;
  if(typeof p==="string"){ try{ return JSON.parse(p); }catch(_e){ return p; } }
  return p;
}

/* ---------- nacteni ---------- */
function najdiNejnovejsi(){
  return zavolej("search_files",{query:"parentId = '"+SLOZKA+"' and title contains 'prani-data'", pageSize:25, excludeContentSnippets:true},{cache:false})
  .then(function(res){
    var p=payload(res)||{}; var soubory=p.files||[];
    if(!soubory.length) return null;
    soubory.sort(function(a,b){ return (b.modifiedTime||"").localeCompare(a.modifiedTime||""); });
    return soubory[0];
  });
}
function stahni(fileId){
  return zavolej("download_file_content",{fileId:fileId},{cache:false}).then(function(res){
    var p=payload(res)||{};
    var bin=atob(p.content||"");
    var bajty=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bajty[i]=bin.charCodeAt(i);
    return JSON.parse(new TextDecoder("utf-8").decode(bajty));
  });
}

    if(!soubor){ stav("Na Drivu zatím nejsou data", "pozor");
      $("sekce-fronta").innerHTML='<div class="banner"><b>Začínáme</b>Na Drivu ještě není soubor s daty. Jedním klepnutím se založí startovní seznam se všemi lidmi.'+
        '<div class="k-akce"><button class="tl-akcent" id="tlZalozit">Založit data na Drivu</button></div></div>';
      $("tlZalozit").onclick=function(){
        D=JSON.parse(JSON.stringify(SEED)); doplnFrontu(); spinave=true; ukazListu(); uloz();
      };
      return; }
    return stahni(soubor.id).then(function(data){
      D=data; nacteno={id:soubor.id, modifiedTime:soubor.modifiedTime};
      doplnFrontu(); spinave=false; ukazListu();
      stav("Načteno "+new Date().toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"}));
      vykresli();
    });
  }).catch(function(e){
    var ch=popisChyby(e);
    if(ch.retry&&!pokus){ setTimeout(function(){ nacti(1); }, 1200+Math.random()*1200); }
    stav(ch.t, ch.d);
  });
}

/* ---------- generovani fronty ---------- */
function doplnFrontu(){
  var dnes=dnesStr();
  var mam={}; (D.fronta||[]).forEach(function(f){ mam[f.id]=true; });
  var ted=new Date();
  for(var i=0;i<D.lide.length;i++){
    var p=D.lide[i];
    [["narozeniny",p.narozeniny,p.pratNarozeniny],["svatek",p.svatek,p.pratSvatek]].forEach(function(u){
      if(!u[1]||!u[2]) return;
      var md=u[1].split("-").map(Number);
      for(var r=ted.getFullYear(); r<=ted.getFullYear()+1; r++){
        var dt=new Date(r,md[0]-1,md[1]);
        if(dt.getMonth()!==md[0]-1) continue;
        var iso=r+"-"+String(md[0]).padStart(2,"0")+"-"+String(md[1]).padStart(2,"0");
        var rozdil=(new Date(iso)-new Date(dnes))/86400000;
        if(rozdil<0||rozdil>HORIZONT) continue;
        var id=u[0]+"-"+p.id+"-"+iso;
        if(!mam[id]){ D.fronta.push({id:id, osobaId:p.id, typ:u[0], datum:iso, cas:"", text:"", stav:"chybi"}); mam[id]=true; }
      }
    });
  }
  D.fronta.sort(function(a,b){ return (a.datum+casPro(a)).localeCompare(b.datum+casPro(b)); });
}

/* ---------- ulozeni ---------- */
function sloucit(mistni, vzdalene){
  // vzdalene vyhrava u stavu odeslano/selhalo a u logu odeslanych, mistni u textu a lidi
  var stavy={}; (vzdalene.fronta||[]).forEach(function(f){ if(f.stav==="odeslano"||f.stav==="selhalo") stavy[f.id]=f; });
  (mistni.fronta||[]).forEach(function(f){
    var v=stavy[f.id]; if(v){ f.stav=v.stav; f.odeslanoKdy=v.odeslanoKdy; }
  });
  var mamO={}; (mistni.odeslane||[]).forEach(function(o){ mamO[o.id]=true; });
  (vzdalene.odeslane||[]).forEach(function(o){ if(!mamO[o.id]) mistni.odeslane.push(o); });
  return mistni;
}
function uloz(){
  if(!D||!spinave) return;
  var tl=$("tlUlozit"); tl.disabled=true; $("ulozitText").textContent="Ukládám...";
  najdiNejnovejsi().then(function(soubor){
    var priprava=Promise.resolve(D);
    if(soubor&&nacteno&&soubor.id!==nacteno.id){
      priprava=stahni(soubor.id).then(function(vzdalene){ return sloucit(D, vzdalene); });
    }
    return priprava;
  }).then(function(data){
    data.aktualizovano=new Date().toISOString();
    data.verze=(data.verze||0)+1;
    return zavolej("create_file",{
      title:NAZEV, parentId:SLOZKA, textContent:JSON.stringify(data),
      contentMimeType:"application/json", disableConversionToGoogleType:true
    });
  }).then(function(res){
    var p=payload(res)||{};
    nacteno={id:p.id, modifiedTime:p.modifiedTime};
    spinave=false; ukazListu(); vykresli(); toast("Uloženo");
    stav("Uloženo "+new Date().toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"}));
  }).catch(function(e){
    var kod=e&&e.code;
    if(kod==="server_unavailable"||kod==="upstream_error"){
      stav("Uložení nedoběhlo, možná ale prošlo. Načti znovu a zkontroluj.", "pozor");
    } else { stav(popisChyby(e).t, "chyba"); }
    toast("Uložení se nepovedlo");
  }).finally(function(){ tl.disabled=false; $("ulozitText").textContent="Neuložené změny"; });
}
function zmena(){ spinave=true; ukazListu(); }
function ukazListu(){ $("ulozitListu").classList.toggle("videt", spinave); }

/* ---------- vykresleni ---------- */
function vykresli(){
  if(!D) return;
  ["fronta","nova","lidi","poslane"].forEach(function(t){ $("sekce-"+t).hidden=(t!==tab); });
  document.querySelectorAll("#taby button").forEach(function(b){ b.classList.toggle("aktivni", b.dataset.tab===tab); });
  if(tab==="fronta") vykresliFrontu();
  if(tab==="nova") vykresliNovou();
  if(tab==="lidi") vykresliLidi();
  if(tab==="poslane") vykresliPoslane();
  var kDoplneni=D.fronta.filter(function(f){
    if(f.stav==="vynechat"||f.stav==="odeslano") return false;
    if(f.datum<dnesStr()) return false;
    var p=osoba(f.osobaId);
    return !f.text||!(p&&p.tel);
  }).length;
  var b=$("badgeFronta"); b.hidden=!kDoplneni; b.textContent=kDoplneni;
}

function chipTyp(typ){
  if(typ==="narozeniny") return '<span class="chip narozeniny">🎂 narozeniny</span>';
  if(typ==="svatek") return '<span class="chip svatek">🌼 svátek</span>';
  return '<span class="chip zprava">✉️ zpráva</span>';
}

function vykresliFrontu(){
  var el=$("sekce-fronta"), dnes=dnesStr(), html="";
  var dotazy=(D.dotazy||[]).filter(function(q){ return !q.vyreseno; });
  dotazy.forEach(function(q){
    html+='<div class="banner"><b>Potřebuju rozhodnout</b>'+esc(q.text)+'<div class="k-akce">'+
      q.volby.map(function(v){ var md=v.split("-"); return '<button class="tl-jemne" data-dotaz="'+esc(q.id)+'" data-volba="'+esc(v)+'">'+md[1]+". "+md[0]+".</button>"; }).join("")+
      '</div></div>';
  });
  var polozky=D.fronta.filter(function(f){ return f.datum>=dnes&&f.stav!=="odeslano"; });
  if(!polozky.length&&!dotazy.length){
    html+='<div class="prazdno"><div class="velke">🎈</div>Dalších '+HORIZONT+' dní je klid.<br>Nikdo nemá narozeniny ani svátek.</div>';
  }
  var minuleDatum="";
  polozky.forEach(function(f){
    var p=osoba(f.osobaId); if(!p) return;
    if(f.datum!==minuleDatum){
      minuleDatum=f.datum;
      var znacka=f.datum===dnes?' <span class="dnes">&middot; dnes</span>':"";
      html+='<div class="den-hlava">'+hezkyDatum(f.datum)+znacka+'</div>';
    }
    var chipy=chipTyp(f.typ);
    if(f.stav==="vynechat") chipy+='<span class="chip">vynecháno</span>';
    else if(f.stav==="selhalo") chipy+='<span class="chip chyba">neodešlo</span>';
    else if(!p.tel) chipy+='<span class="chip pozor">chybí číslo</span>';
    else if(!f.text) chipy+='<span class="chip pozor">chybí text</span>';
    else chipy+='<span class="chip ok">připraveno</span>';
    html+='<div class="karta'+(f.stav==="vynechat"?" vynechana":"")+'" data-fid="'+esc(f.id)+'">'+
      '<div class="k-hlava"><div><div class="k-jmeno">'+esc(p.jmeno)+'</div><div class="k-kdo">'+esc(p.kdo||p.svet||"")+'</div></div>'+
      '<div class="chipy">'+chipy+'</div></div>';
    if(f.stav!=="vynechat"){
      html+='<div class="k-telo">'+
        '<textarea data-pole="text" placeholder="Sem napiš, co se má poslat...">'+esc(f.text)+'</textarea>';
      if(!p.tel) html+='<input type="tel" data-pole="tel" placeholder="Doplň telefon, třeba +420 606 123 456">';
      html+='<div class="radek"><label>Odejde v</label><input type="time" data-pole="cas" value="'+esc(casPro(f))+'"></div></div>';
    }
    html+='<div class="k-akce">';
    if(f.stav==="vynechat"){ html+='<button class="tl-jemne" data-akce="vratit">Vrátit do fronty</button>'; }
    else{
      html+='<button class="tl-jemne" data-akce="vynechat">Letos vynechat</button>';
      if(p.tel&&f.text) html+='<a class="tl-ok" href="'+esc(smsOdkaz(p.tel,f.text))+'">Poslat hned ručně</a>';
    }
    html+='</div></div>';
  });
  el.innerHTML=html;

  el.querySelectorAll("[data-dotaz]").forEach(function(b){ b.onclick=function(){
    var q=(D.dotazy||[]).find(function(x){ return x.id===b.dataset.dotaz; }); if(!q) return;
    var p=osoba(q.osobaId); if(p){ p.narozeniny=b.dataset.volba; p.pratNarozeniny=true; }
    q.vyreseno=true; doplnFrontu(); zmena(); vykresli(); toast("Zapsáno");
  }; });
  el.querySelectorAll(".karta[data-fid]").forEach(function(k){
    var f=D.fronta.find(function(x){ return x.id===k.dataset.fid; }); if(!f) return;
    var p=osoba(f.osobaId);
    var ta=k.querySelector("[data-pole=text]");
    if(ta){
      var roste=function(){ ta.style.height="auto"; ta.style.height=(ta.scrollHeight+2)+"px"; };
      roste(); ta.addEventListener("input", function(){ f.text=ta.value; f.stav=f.text?"ceka":"chybi"; roste(); zmena(); });
      ta.addEventListener("blur", function(){ vykresli(); });
    }
    var tel=k.querySelector("[data-pole=tel]");
    if(tel) tel.addEventListener("change", function(){ if(p){ p.tel=tel.value.trim(); zmena(); vykresli(); } });
    var cas=k.querySelector("[data-pole=cas]");
    if(cas) cas.addEventListener("change", function(){ f.cas=cas.value; zmena(); });
    k.querySelectorAll("[data-akce]").forEach(function(b){ b.onclick=function(){
      if(b.dataset.akce==="vynechat") f.stav="vynechat";
      else f.stav=f.text?"ceka":"chybi";
      zmena(); vykresli();
    }; });
  });
}

function vykresliNovou(){
  var el=$("sekce-nova");
  var html='<div class="karta"><div class="nova-form">';
  if(novaVyber){
    var p=osoba(novaVyber);
    html+='<div class="vybrany"><b>'+esc(p.jmeno)+'</b><span class="osoba-meta">'+esc(p.tel||"bez čísla")+'</span><button data-akce="zrusit" aria-label="Zrušit výběr">&times;</button></div>';
  } else {
    html+='<input type="search" id="novaHledani" placeholder="Komu? Začni psát jméno..." value="'+esc(novaHledej)+'">';
    if(novaHledej){
      var shody=D.lide.filter(function(p){ return fold(p.jmeno).indexOf(fold(novaHledej))>=0; }).slice(0,8);
      html+='<div class="osoba-seznam">'+ (shody.length? shody.map(function(p){
        return '<div class="osoba-rada" data-vyber="'+esc(p.id)+'"><div class="osoba-info"><div class="osoba-jmeno">'+esc(p.jmeno)+'</div>'+
        '<div class="osoba-meta">'+esc([p.kdo,p.svet].filter(Boolean).join(" · "))+'</div></div>'+
        '<div class="osoba-datumy">'+(p.tel?"📱":"bez čísla")+'</div></div>';
      }).join(""):'<div class="osoba-rada">Nikdo takový v seznamu není.</div>')+'</div>';
    }
  }
  var dnes=new Date(), moznosti=[];
  for(var i=0;i<3;i++){ var d=new Date(dnes); d.setDate(d.getDate()+i);
    var iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    moznosti.push([i===0?"Dnes":i===1?"Zítra":DNY[d.getDay()]+" "+d.getDate()+".", iso]); }
  if(!novaDatum) novaDatum=moznosti[0][1];
  html+='<div class="radek"><label>Kdy</label><div class="datum-chipy">'+
    moznosti.map(function(m){ return '<button data-datum="'+m[1]+'" class="'+(novaDatum===m[1]?"aktivni":"")+'">'+m[0]+'</button>'; }).join("")+
    '<input type="date" id="novaDatumVlastni" value="'+esc(novaDatum)+'" min="'+dnesStr()+'"></div></div>';
  html+='<div class="radek"><label>V kolik</label><input type="time" id="novaCas" value="'+vychoziCas()+'"></div>';
  html+='<textarea id="novaText" placeholder="Text zprávy..."></textarea>';
  html+='<div class="k-akce"><button class="tl-akcent" id="novaPridat">Přidat do fronty</button></div>';
  html+='</div></div>';
  el.innerHTML=html;

  var hl=$("novaHledani");
  if(hl){ hl.oninput=function(){ novaHledej=hl.value; vykresliNovou(); var n=$("novaHledani"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); }; }
  el.querySelectorAll("[data-vyber]").forEach(function(r){ r.onclick=function(){ novaVyber=r.dataset.vyber; vykresliNovou(); }; });
  var zr=el.querySelector("[data-akce=zrusit]"); if(zr) zr.onclick=function(){ novaVyber=null; novaHledej=""; vykresliNovou(); };
  el.querySelectorAll("[data-datum]").forEach(function(b){ b.onclick=function(){ novaDatum=b.dataset.datum; $("novaDatumVlastni").value=novaDatum; vykresliNovou(); }; });
  $("novaDatumVlastni").onchange=function(){ novaDatum=this.value; vykresliNovou(); };
  $("novaPridat").onclick=function(){
    var text=$("novaText").value.trim();
    if(!novaVyber){ toast("Vyber, komu se má psát"); return; }
    if(!text){ toast("Chybí text zprávy"); return; }
    D.fronta.push({ id:"zprava-"+novaVyber+"-"+novaDatum+"-"+Math.floor(Math.random()*1e6),
      osobaId:novaVyber, typ:"zprava", datum:novaDatum, cas:$("novaCas").value||vychoziCas(), text:text, stav:"ceka" });
    D.fronta.sort(function(a,b){ return (a.datum+casPro(a)).localeCompare(b.datum+casPro(b)); });
    novaVyber=null; novaHledej=""; novaDatum=null;
    zmena(); tab="fronta"; vykresli(); toast("Ve frontě");
  };
}

function vykresliLidi(){
  var el=$("sekce-lidi");
  var bezCisla=D.lide.filter(function(p){ return (p.pratNarozeniny||p.pratSvatek)&&!p.tel; }).length;
  var html='<div class="hledani"><input type="search" id="lidiHledani" placeholder="Hledat mezi '+D.lide.length+' lidmi..." value="'+esc(lidiHledej)+'"></div>';
  html+='<div class="filtr-chipy">'+
    [["vse","Všichni"],["bez-cisla","Bez čísla ("+bezCisla+")"],["jadro","Jádro a blízcí"],["narozeniny","S narozeninami"]].map(function(f){
      return '<button data-filtr="'+f[0]+'" class="'+(lidiFiltr===f[0]?"aktivni":"")+'">'+f[1]+'</button>'; }).join("")+'</div>';
  var seznam=D.lide.filter(function(p){
    if(lidiHledej&&fold(p.jmeno+" "+(p.kdo||"")).indexOf(fold(lidiHledej))<0) return false;
    if(lidiFiltr==="bez-cisla") return (p.pratNarozeniny||p.pratSvatek)&&!p.tel;
    if(lidiFiltr==="jadro") return p.blizkost==="Jádro"||p.blizkost==="Blízcí";
    if(lidiFiltr==="narozeniny") return !!p.narozeniny;
    return true;
  });
  html+='<div class="osoba-seznam">';
  if(!seznam.length) html+='<div class="osoba-rada">Nikdo neodpovídá hledání.</div>';
  seznam.slice(0,120).forEach(function(p){
    var data=[];
    if(p.narozeniny){ var n=p.narozeniny.split("-"); data.push("🎂 "+n[1]+". "+n[0]+"."); }
    if(p.svatek&&p.pratSvatek){ var s=p.svatek.split("-"); data.push("🌼 "+s[1]+". "+s[0]+"."); }
    html+='<div><div class="osoba-rada" data-osoba="'+esc(p.id)+'"><div class="osoba-info">'+
      '<div class="osoba-jmeno">'+esc(p.jmeno)+(p.tel?"":' <span class="chip pozor">bez čísla</span>')+'</div>'+
      '<div class="osoba-meta">'+esc([p.kdo,p.svet].filter(Boolean).join(" · ")||" ")+'</div></div>'+
      '<div class="osoba-datumy">'+data.join("<br>")+'</div></div>';
    if(lidiOtevreny===p.id){
      html+='<div class="osoba-detail">'+
        '<div class="radek"><label>Telefon</label><input type="tel" data-pole="tel" value="'+esc(p.tel)+'" placeholder="+420..."></div>'+
        '<div class="radek"><label>Čas přání</label><input type="time" data-pole="cas" value="'+esc(p.cas||"")+'" placeholder="'+vychoziCas()+'"></div>'+
        (p.narozeniny?'<label class="prepinac">Přát k narozeninám <input type="checkbox" data-pole="pratNarozeniny" '+(p.pratNarozeniny?"checked":"")+'></label>':"")+
        (p.svatek?'<label class="prepinac">Přát k svátku <input type="checkbox" data-pole="pratSvatek" '+(p.pratSvatek?"checked":"")+'></label>':"")+
        '<div class="radek"><label>Narozeniny</label><input type="text" data-pole="narozeniny" value="'+esc(p.narozeniny)+'" placeholder="měsíc-den, třeba 10-9"></div>'+
      '</div>';
    }
    html+='</div>';
  });
  html+='</div>';
  if(seznam.length>120) html+='<div class="paticka">Zobrazuju prvních 120, zbytek najdeš hledáním.</div>';
  html+='<div class="karta" style="margin-top:14px"><div class="radek"><label>Výchozí čas</label><input type="time" id="nastavCas" value="'+vychoziCas()+'"></div></div>';
  el.innerHTML=html;

  var hl=$("lidiHledani");
  hl.oninput=function(){ lidiHledej=hl.value; lidiOtevreny=null; vykresliLidi(); var n=$("lidiHledani"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };
  el.querySelectorAll("[data-filtr]").forEach(function(b){ b.onclick=function(){ lidiFiltr=b.dataset.filtr; lidiOtevreny=null; vykresliLidi(); }; });
  el.querySelectorAll("[data-osoba]").forEach(function(r){ r.onclick=function(){
    lidiOtevreny=(lidiOtevreny===r.dataset.osoba)?null:r.dataset.osoba; vykresliLidi();
  }; });
  el.querySelectorAll(".osoba-detail [data-pole]").forEach(function(inp){
    var p=osoba(lidiOtevreny); if(!p) return;
    inp.addEventListener("change", function(){
      var pole=inp.dataset.pole;
      if(inp.type==="checkbox") p[pole]=inp.checked; else p[pole]=inp.value.trim();
      if(pole==="narozeniny") p.pratNarozeniny=!!p.narozeniny&&p.pratNarozeniny!==false;
      doplnFrontu(); zmena();
    });
  });
  $("nastavCas").onchange=function(){ D.nastaveni.vychoziCas=this.value; zmena(); };
}

function vykresliPoslane(){
  var el=$("sekce-poslane"), dnes=dnesStr();
  var polozky=[];
  (D.fronta||[]).forEach(function(f){
    if(f.stav==="odeslano"||f.stav==="selhalo"||(f.datum<dnes&&f.stav!=="vynechat")) polozky.push(f);
  });
  (D.odeslane||[]).forEach(function(o){ polozky.push(o); });
  var videne={}; polozky=polozky.filter(function(f){ if(videne[f.id]) return false; videne[f.id]=true; return true; });
  polozky.sort(function(a,b){ return (b.odeslanoKdy||b.datum).localeCompare(a.odeslanoKdy||a.datum); });
  if(!polozky.length){ el.innerHTML='<div class="prazdno"><div class="velke">📮</div>Zatím nic neodešlo.</div>'; return; }
  var html="";
  polozky.slice(0,80).forEach(function(f){
    var p=osoba(f.osobaId); var jmeno=p?p.jmeno:(f.jmeno||"");
    var chip= f.stav==="odeslano"?'<span class="chip ok">odesláno</span>':
              f.stav==="selhalo"?'<span class="chip chyba">neodešlo</span>':
              '<span class="chip pozor">propadlo</span>';
    html+='<div class="karta"><div class="k-hlava"><div><div class="k-jmeno">'+esc(jmeno)+'</div>'+
      '<div class="k-kdo">'+hezkyDatum(f.datum)+(f.odeslanoKdy?(" · "+new Date(f.odeslanoKdy).toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"})):"")+'</div></div>'+
      '<div class="chipy">'+chipTyp(f.typ)+chip+'</div></div>';
    if(f.text) html+='<div class="k-telo"><div class="k-kdo">'+esc(f.text)+'</div></div>';
    if(f.stav!=="odeslano"&&p&&p.tel&&f.text) html+='<div class="k-akce"><a class="tl-ok" href="'+esc(smsOdkaz(p.tel,f.text))+'">Poslat ručně</a></div>';
    html+='</div>';
  });
  el.innerHTML=html;
}

/* ---------- start ---------- */
document.querySelectorAll("#taby button").forEach(function(b){
  b.onclick=function(){ tab=b.dataset.tab; vykresli(); window.scrollTo({top:0}); };
});
$("tlObnovit").onclick=function(){
  if(spinave&&!confirm("Máš neuložené změny, načtením o ně přijdeš. Pokračovat?")) return;
  nacti();
};
$("tlUlozit").onclick=uloz;
window.addEventListener("beforeunload", function(e){ if(spinave){ e.preventDefault(); e.returnValue=""; } });
document.addEventListener("keydown", function(e){ if((e.metaKey||e.ctrlKey)&&e.key==="s"){ e.preventDefault(); uloz(); } });
nacti();
})();
</script>
